# ANKA OS — Calamares settings
# Rendered by iso/calamares/default.nix (@ankaModules@ becomes a store path).
---
modules-search: [ local, "@ankaModules@" ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - users
  - packagechooser   # full or light (anka.profile)
  - partition
  - summary
- exec:
  - partition
  - mount
  - ankainstall   # writes /etc/nixos as an ANKA flake and runs nixos-install
  - users         # sets the password of the user declared by ankainstall
  - umount
- show:
  - finished

branding: anka

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
