# ANKA OS — user page
# Group membership is declared in configuration.nix by the ankainstall job;
# the users job only sets the password, so only list groups that exist on
# every NixOS system.
---
defaultGroups:
  - users
  - networkmanager
  - wheel

# One password for everything: the administrator (root) account reuses the
# user's password unless the user unticks the box.
setRootPassword: true
doReusePassword: true
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: 64
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
  shell: /run/current-system/sw/bin/bash
  forbidden_names: [ root ]

hostname:
  location: None
  writeHostsFile: false
  template: "anka-${first}"
  forbidden_names: [ localhost ]
