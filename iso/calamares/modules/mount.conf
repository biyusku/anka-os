# ANKA OS — mounts during installation
# Btrfs subvolume layout; keep in sync with BTRFS_SUBVOLUMES in
# ../ankainstall/main.py and with modules/system/filesystem.nix.
---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /nix
    subvolume: /@nix
  - mountPoint: /.snapshots
    subvolume: /@snapshots

mountOptions:
  - filesystem: efi
    options: [ fmask=0077, dmask=0077 ]
  - filesystem: btrfs
    options: [ compress=zstd:1, noatime ]
