# ANKA OS — disk page
# Btrfs is the default so snapshots work out of the box; the subvolume
# layout is in mount.conf.
---
efi:
  mountPoint: "/boot"
  recommendedSize: 1GiB
  minimumSize: 32MiB
  label: "EFI"

# Swap is zram (anka.performance.zram), no swap partition.
userSwapChoices:
  - none

luksGeneration: luks2
initialPartitionTableType: gpt

defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - btrfs
  - ext4

showNotEncryptedBootMessage: false

partitionLayout:
  - name: "root"
    filesystem: "unknown"
    noEncrypt: false
    mountPoint: "/"
    size: 100%
