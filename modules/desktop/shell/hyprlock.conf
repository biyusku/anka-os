# ANKA OS — lock screen for ANKA Shell (modules/desktop/shell).

general {
    hide_cursor = true
}

background {
    path = @lockBackground@
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

label {
    text = $TIME
    font_family = Inter
    font_size = 96
    color = rgba(f5f5f7ff)
    position = 0, 180
    halign = center
    valign = center
}

input-field {
    size = 280, 48
    rounding = 14
    outline_thickness = 1
    outer_color = rgba(ffffff22)
    inner_color = rgba(1c1c1edd)
    font_color = rgba(f5f5f7ff)
    check_color = rgba(ffffff55)
    fail_color = rgba(e74c3cff)
    placeholder_text = Parola
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}
