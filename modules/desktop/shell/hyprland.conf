# ANKA OS — Hyprland defaults for ANKA Shell.
# Generated from modules/desktop/shell/hyprland.conf; updated with ANKA.
# Your own settings go in ~/.config/hypr/hyprland.conf, after the line that
# sources this file.

monitor = , preferred, auto, 1

env = ANKA_WALLPAPER,@wallpaper@
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprpolkitagent
exec-once = @hypridle@ -c /etc/anka/hypr/hypridle.conf
exec-once = @quickshell@ -p @shell@

input {
    kb_layout = @kbLayout@
    kb_variant = @kbVariant@
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Calm, thin borders; the window shadow does the separating.
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(ffffff33)
    col.inactive_border = rgba(ffffff12)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14

    blur {
        enabled = true
        size = 8
        passes = 3
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}

# Short and soft: windows grow in, workspaces slide.
animations {
    enabled = true

    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = snappy, 0.2, 0.9, 0.1, 1

    animation = windows, 1, 5, smooth, popin 85%
    animation = windowsOut, 1, 4, snappy, popin 85%
    animation = fade, 1, 4, smooth
    animation = layers, 1, 4, smooth, fade
    animation = workspaces, 1, 5, smooth, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

xwayland {
    force_zero_scaling = true
}

# ── Keys (Super = the Windows / ⌘ key) ─────────────────────────────────────
$mod = SUPER

bind = $mod, Space, exec, @launcher@
bind = $mod, Return, exec, konsole
bind = $mod, E, exec, dolphin
bind = $mod, B, exec, firefox
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, @hyprlock@ -c /etc/anka/hypr/hyprlock.conf
bind = $mod SHIFT, Q, exit

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, @media@ volume-up
bindel = , XF86AudioLowerVolume, exec, @media@ volume-down
bindl = , XF86AudioMute, exec, @media@ mute
bindl = , XF86AudioMicMute, exec, @media@ mic-mute
bindel = , XF86MonBrightnessUp, exec, @media@ brightness-up
bindel = , XF86MonBrightnessDown, exec, @media@ brightness-down
